<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Records — TBSS</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Supabase JS client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary:   #1a365d;
      --secondary: #2c5282;
      --accent:    #d69e2e;
      --accent2:   #b7791f;
      --border:    #e2e8f0;
      --muted:     #718096;
      --bg:        #f0f4f8;
      --dark:      #1a202c;
      --f1-color:  #2c5282;
      --f5-color:  #276749;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family:'DM Sans',sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height:100vh;
    }

    /* ── HEADER ── */
    .header {
      background:#fff;
      border-bottom:3px solid var(--accent);
      box-shadow:0 2px 10px rgba(0,0,0,.06);
      position:sticky; top:0; z-index:100;
    }
    .nav {
      max-width:1100px; margin:0 auto;
      padding:.9rem 2rem;
      display:flex; align-items:center; justify-content:space-between; gap:1rem;
    }
    .brand { display:flex; align-items:center; gap:.85rem; }
    .brand-icon {
      width:44px; height:44px; border-radius:10px;
      background:linear-gradient(135deg,var(--primary),var(--secondary));
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-family:'Playfair Display',serif;
      font-weight:900; font-size:1rem;
    }
    .brand-text h1 {
      font-family:'Playfair Display',serif;
      font-size:1.05rem; color:var(--primary); font-weight:900;
    }
    .brand-text p { font-size:.68rem; color:var(--muted); letter-spacing:.5px; font-weight:600; }

    .hdr-right { display:flex; align-items:center; gap:.65rem; }
    .pill {
      background:#ebf4ff; color:var(--secondary);
      border:1px solid #bee3f8; border-radius:20px;
      padding:.28rem .85rem; font-size:.75rem; font-weight:700;
    }
    .pill.online  { background:#f0fff4; color:#276749; border-color:#9ae6b4; }
    .pill.offline { background:#fff5f5; color:#c53030; border-color:#feb2b2; }
    .pill.loading { background:#fffff0; color:#b7791f; border-color:#faf089; }

    /* ── PAGE ── */
    .page { max-width:1100px; margin:0 auto; padding:1.75rem 2rem; }

    /* ── LOADER OVERLAY ── */
    .loader-wrap {
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:4rem 2rem; gap:1rem;
    }
    .spinner {
      width:40px; height:40px; border-radius:50%;
      border:4px solid var(--border);
      border-top-color:var(--secondary);
      animation:spin .75s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loader-txt { font-size:.85rem; color:var(--muted); font-weight:600; }

    /* ── ERROR BANNER ── */
    .error-banner {
      background:#fff5f5; border:1px solid #feb2b2;
      border-radius:10px; padding:1rem 1.3rem;
      margin-bottom:1.2rem;
      display:flex; align-items:flex-start; gap:.75rem;
    }
    .error-banner i { color:#c53030; margin-top:2px; }
    .error-banner .err-body h4 { font-size:.88rem; color:#c53030; margin-bottom:.25rem; }
    .error-banner .err-body p  { font-size:.8rem; color:#742a2a; line-height:1.5; }

    /* ── SEARCH BAR ── */
    .search-wrap {
      background:#fff; border-radius:12px;
      border:1px solid var(--border);
      padding:.85rem 1.2rem;
      margin-bottom:1.4rem;
      display:flex; align-items:center; gap:.75rem;
      box-shadow:0 1px 4px rgba(0,0,0,.04);
    }
    .search-wrap i { color:var(--muted); font-size:.95rem; }
    .search-wrap input {
      flex:1; border:none; outline:none;
      font-family:'DM Sans',sans-serif;
      font-size:.9rem; color:var(--dark);
      background:transparent;
    }
    .search-wrap input::placeholder { color:#c0c8d4; }
    #searchCount {
      font-size:.72rem; color:var(--muted); font-weight:600; white-space:nowrap;
    }

    /* ── FORM TABS ── */
    .tabs {
      display:flex; gap:.5rem; margin-bottom:1.4rem;
    }
    .tab-btn {
      padding:.6rem 1.6rem;
      border:2px solid var(--border); border-radius:10px;
      background:#fff; color:var(--muted);
      font-family:'DM Sans',sans-serif; font-size:.88rem; font-weight:700;
      cursor:pointer; display:flex; align-items:center; gap:.5rem;
      transition:all .2s;
    }
    .tab-btn .badge-count {
      background:var(--border); color:var(--muted);
      border-radius:20px; padding:.1rem .55rem;
      font-size:.7rem; font-weight:700;
      transition:all .2s;
    }
    .tab-btn.active-f1 {
      background:var(--f1-color); border-color:var(--f1-color); color:#fff;
    }
    .tab-btn.active-f1 .badge-count { background:rgba(255,255,255,.25); color:#fff; }
    .tab-btn.active-f5 {
      background:var(--f5-color); border-color:var(--f5-color); color:#fff;
    }
    .tab-btn.active-f5 .badge-count { background:rgba(255,255,255,.25); color:#fff; }
    .tab-btn:not(.active-f1):not(.active-f5):hover {
      border-color:var(--secondary); color:var(--secondary);
    }

    /* ── TAB PANELS ── */
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    /* ── YEAR SECTION ── */
    .year-section {
      background:#fff; border-radius:12px;
      border:1px solid var(--border);
      box-shadow:0 1px 4px rgba(0,0,0,.04);
      margin-bottom:1rem;
      overflow:hidden;
    }
    .year-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:.9rem 1.3rem; cursor:pointer;
      user-select:none;
      transition:background .15s;
    }
    .year-header:hover { background:#f7fafc; }
    .year-left { display:flex; align-items:center; gap:.75rem; }
    .year-badge {
      display:flex; align-items:center; justify-content:center;
      width:46px; height:46px; border-radius:10px;
      font-family:'Playfair Display',serif;
      font-size:.95rem; font-weight:900; color:#fff;
      flex-shrink:0;
    }
    .f1 .year-badge { background:linear-gradient(135deg,#2c5282,#4299e1); }
    .f5 .year-badge { background:linear-gradient(135deg,#276749,#48bb78); }

    .year-label {
      font-family:'Playfair Display',serif;
      font-size:1rem; font-weight:700; color:var(--primary);
    }
    .year-sub { font-size:.72rem; color:var(--muted); font-weight:600; margin-top:1px; }
    .year-right { display:flex; align-items:center; gap:.75rem; }
    .year-count {
      font-size:.75rem; font-weight:700; color:#fff;
      background:var(--accent); border-radius:20px;
      padding:.2rem .7rem;
    }
    .chevron {
      color:var(--muted); font-size:.85rem;
      transition:transform .25s;
    }
    .year-section.open .chevron { transform:rotate(180deg); }

    /* ── NAMES LIST ── */
    .names-body {
      border-top:1px solid var(--border);
      max-height:0; overflow:hidden;
      transition:max-height .35s ease;
    }
    .year-section.open .names-body { max-height:9999px; }

    .names-list {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
      gap:0;
      padding:.5rem 0;
    }
    .name-item {
      display:flex; align-items:center; gap:.65rem;
      padding:.62rem 1.3rem;
      border-bottom:1px solid #f7fafc;
      transition:background .12s;
    }
    .name-item:hover { background:#f7fafc; }
    .name-item:last-child { border-bottom:none; }
    .name-no {
      font-size:.7rem; font-weight:700; color:var(--muted);
      min-width:22px; text-align:right; flex-shrink:0;
    }
    .name-txt {
      font-size:.88rem; font-weight:600; color:var(--dark);
      line-height:1.3;
    }
    .name-txt mark {
      background:#fef3c7; color:var(--dark);
      border-radius:3px; padding:0 2px;
    }

    /* ── EMPTY STATE ── */
    .empty {
      padding:4rem 2rem; text-align:center;
    }
    .empty .ico { font-size:2.8rem; color:#cbd5e0; margin-bottom:.9rem; }
    .empty h3 { font-size:1rem; color:var(--dark); margin-bottom:.4rem; }
    .empty p { font-size:.85rem; color:var(--muted); line-height:1.6; }
    .empty a {
      display:inline-block; margin-top:1rem;
      background:linear-gradient(135deg,var(--primary),var(--secondary));
      color:#fff; text-decoration:none; border-radius:8px;
      padding:.5rem 1.2rem; font-size:.82rem; font-weight:700;
    }

    /* ── NO RESULTS ── */
    .no-results {
      padding:2.5rem; text-align:center; color:var(--muted); font-size:.88rem;
    }

    /* ── REFRESH BUTTON ── */
    .refresh-btn {
      background:#fff; border:1px solid var(--border);
      border-radius:8px; padding:.4rem .9rem;
      font-family:'DM Sans',sans-serif; font-size:.78rem;
      font-weight:700; color:var(--secondary);
      cursor:pointer; display:flex; align-items:center; gap:.4rem;
      transition:all .2s;
    }
    .refresh-btn:hover { background:var(--secondary); color:#fff; border-color:var(--secondary); }
    .refresh-btn i { font-size:.75rem; }
    .refresh-btn.spinning i { animation:spin .6s linear infinite; }

    @media(max-width:640px){
      .nav { padding:.75rem 1rem; }
      .page { padding:1rem; }
      .brand-text h1 { font-size:.92rem; }
      .names-list { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="nav">
    <div class="brand">
      <div class="brand-icon">TB</div>
      <div class="brand-text">
        <h1>Tabora Boys Secondary School</h1>
        <p>STUDENT RECORDS · NAME REGISTER</p>
      </div>
    </div>
    <div class="hdr-right">
      <div class="pill loading" id="statusPill">
        <i class="fas fa-circle-notch fa-spin" style="margin-right:4px;font-size:.65rem;"></i>Connecting…
      </div>
      <div class="pill" id="hdrTotal" style="display:none">0 students</div>
      <button class="refresh-btn" id="refreshBtn" onclick="loadAll()" title="Refresh data">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
    </div>
  </div>
</header>

<div class="page">

  <!-- ERROR BANNER (hidden by default) -->
  <div class="error-banner" id="errorBanner" style="display:none">
    <i class="fas fa-exclamation-circle"></i>
    <div class="err-body">
      <h4>Could not connect to database</h4>
      <p id="errorMsg">Check your Supabase URL and anon key in the script below, then refresh.</p>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Search student name…" oninput="applySearch()">
    <span id="searchCount"></span>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active-f1" id="tabF1" onclick="switchTab('f1')">
      <i class="fas fa-users"></i> Form One
      <span class="badge-count" id="countF1">0</span>
    </button>
    <button class="tab-btn" id="tabF5" onclick="switchTab('f5')">
      <i class="fas fa-graduation-cap"></i> Form Five
      <span class="badge-count" id="countF5">0</span>
    </button>
  </div>

  <!-- FORM 1 PANEL -->
  <div class="tab-panel active f1" id="panelF1" data-label="FORM ONE">
    <div id="f1Content">
      <div class="loader-wrap">
        <div class="spinner"></div>
        <div class="loader-txt">Loading Form One records…</div>
      </div>
    </div>
  </div>

  <!-- FORM 5 PANEL -->
  <div class="tab-panel f5" id="panelF5" data-label="FORM FIVE">
    <div id="f5Content">
      <div class="loader-wrap">
        <div class="spinner"></div>
        <div class="loader-txt">Loading Form Five records…</div>
      </div>
    </div>
  </div>

</div>

<script>
  /* ================================================================
   *  ▼ CONFIGURE YOUR SUPABASE PROJECT HERE ▼
   *  Get these from: supabase.com → Your Project → Settings → API
   * ================================================================ */
  const SUPABASE_URL  = 'https://mfkvwcryiclehbrkqthu.supabase.co';   // ← replace
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ma3Z3Y3J5aWNsZWhicmtxdGh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NDMxMTksImV4cCI6MjA5NTQxOTExOX0.Sj3i_J5TvGCEm-imsmDreXwuOld3NZcuvsCukgcCe7o';                  // ← replace
  /* ================================================================ */

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  /* ── State ── */
  let dataF1 = [], dataF5 = [];
  let currentTab = 'f1';
  let searchQ    = '';

  /* ── Boot ── */
  async function loadAll() {
    setStatus('loading');
    spinRefresh(true);
    document.getElementById('errorBanner').style.display = 'none';

    try {
      const [r1, r5] = await Promise.all([
        db.from('students').select('*').eq('form', 'f1').order('registration_date', { ascending: false }),
        db.from('students').select('*').eq('form', 'f5').order('registration_date', { ascending: false })
      ]);

      if (r1.error) throw r1.error;
      if (r5.error) throw r5.error;

      dataF1 = r1.data || [];
      dataF5 = r5.data || [];

      updateCounts();
      renderTab('f1');
      renderTab('f5');
      setStatus('online');
    } catch (err) {
      console.error('Supabase error:', err);
      setStatus('offline');
      document.getElementById('errorBanner').style.display = 'flex';
      document.getElementById('errorMsg').textContent =
        err.message || 'Unknown error. Check SUPABASE_URL and SUPABASE_ANON key.';
      renderError('f1');
      renderError('f5');
    } finally {
      spinRefresh(false);
    }
  }

  /* ── Status pill ── */
  function setStatus(state) {
    const pill = document.getElementById('statusPill');
    const tot  = document.getElementById('hdrTotal');
    pill.className = 'pill ' + state;
    if (state === 'online') {
      pill.innerHTML = '<i class="fas fa-circle" style="margin-right:4px;font-size:.55rem;color:#48bb78;"></i>Online';
      tot.style.display = '';
    } else if (state === 'offline') {
      pill.innerHTML = '<i class="fas fa-circle" style="margin-right:4px;font-size:.55rem;color:#fc8181;"></i>Offline';
      tot.style.display = 'none';
    } else {
      pill.innerHTML = '<i class="fas fa-circle-notch fa-spin" style="margin-right:4px;font-size:.65rem;"></i>Connecting…';
      tot.style.display = 'none';
    }
  }

  function spinRefresh(on) {
    const btn = document.getElementById('refreshBtn');
    btn.classList.toggle('spinning', on);
    btn.disabled = on;
  }

  /* ── Full name extractor ── */
  function fullName(s) {
    if (!s || typeof s !== 'object') return '(Unknown)';
    if (s.jina1 || s.jina2 || s.jina3)
      return [s.jina1, s.jina2, s.jina3].filter(Boolean).join(' ').trim();
    if (s.firstName || s.lastName)
      return [s.firstName, s.middleName, s.lastName].filter(Boolean).join(' ').trim();
    if (s.first_name || s.last_name)
      return [s.first_name, s.middle_name, s.last_name].filter(Boolean).join(' ').trim();
    const single = s.fullName || s.full_name || s.studentName || s.name || s.jina;
    if (single) return String(single).trim();
    return '(Unknown)';
  }

  /* ── Get year from record ── */
  function getYear(s) {
    if (s.year) return String(s.year);
    const d = s.registration_date || s.registrationDate || s.tarehe || s.created_at;
    if (d) {
      const y = new Date(d).getFullYear();
      if (!isNaN(y)) return String(y);
    }
    return 'Unknown';
  }

  /* ── Group by year ── */
  function groupByYear(arr) {
    const map = {};
    arr.forEach(s => {
      const yr = getYear(s);
      if (!map[yr]) map[yr] = [];
      map[yr].push(fullName(s));
    });
    return Object.keys(map)
      .sort((a, b) => a === 'Unknown' ? 1 : b === 'Unknown' ? -1 : b - a)
      .map(yr => ({ year: yr, names: map[yr].sort() }));
  }

  /* ── Highlight ── */
  function highlight(name, q) {
    if (!q) return name;
    const idx = name.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return name;
    return name.slice(0, idx) +
      `<mark>${name.slice(idx, idx + q.length)}</mark>` +
      name.slice(idx + q.length);
  }

  /* ── Render error state ── */
  function renderError(tab) {
    const target = document.getElementById(tab === 'f1' ? 'f1Content' : 'f5Content');
    target.innerHTML = `
      <div class="year-section">
        <div class="empty">
          <div class="ico"><i class="fas fa-wifi" style="color:#fc8181;"></i></div>
          <h3>Connection failed</h3>
          <p>Could not load records from the database.<br>
             Check your Supabase credentials and try refreshing.</p>
        </div>
      </div>`;
  }

  /* ── Render tab ── */
  function renderTab(tab) {
    const data    = tab === 'f1' ? dataF1 : dataF5;
    const formLbl = tab === 'f1' ? 'Form I' : 'Form V';
    const srcFile = tab === 'f1' ? 'shudi.html' : 'form5.html';
    const target  = document.getElementById(tab === 'f1' ? 'f1Content' : 'f5Content');
    const q       = searchQ.trim();

    if (data.length === 0) {
      target.innerHTML = `
        <div class="year-section">
          <div class="empty">
            <div class="ico"><i class="fas fa-folder-open"></i></div>
            <h3>No ${formLbl} records yet</h3>
            <p>Students who register via <strong>${srcFile}</strong> will appear here automatically.</p>
            <a href="${srcFile}">
              <i class="fas fa-arrow-left" style="margin-right:5px;"></i>Go to Registration
            </a>
          </div>
        </div>`;
      return;
    }

    const groups = groupByYear(data);
    let anyVisible = false;
    let html = '';

    groups.forEach((g, gi) => {
      const filtered = q
        ? g.names.filter(n => n.toLowerCase().includes(q.toLowerCase()))
        : g.names;
      if (filtered.length === 0) return;
      anyVisible = true;

      const isOpen    = gi === 0 || !!q;
      const sectionId = `sec-${tab}-${gi}`;
      const yr        = g.year;

      html += `
        <div class="year-section ${isOpen ? 'open' : ''} ${tab}" id="${sectionId}">
          <div class="year-header" onclick="toggleSection('${sectionId}')">
            <div class="year-left">
              <div class="year-badge">${yr === 'Unknown' ? '?' : yr}</div>
              <div>
                <div class="year-label">${yr === 'Unknown' ? 'Unknown Year' : `Class of ${yr}`}</div>
                <div class="year-sub">${formLbl} · ${g.names.length} student${g.names.length !== 1 ? 's' : ''} total</div>
              </div>
            </div>
            <div class="year-right">
              <span class="year-count">${filtered.length} shown</span>
              <i class="fas fa-chevron-down chevron"></i>
            </div>
          </div>
          <div class="names-body">
            <div class="names-list">
              ${filtered.map((name, i) => `
                <div class="name-item">
                  <span class="name-no">${i + 1}</span>
                  <span class="name-txt">${highlight(name, q)}</span>
                </div>`).join('')}
            </div>
          </div>
        </div>`;
    });

    if (!anyVisible) {
      html = `<div class="no-results">
        <i class="fas fa-search" style="margin-right:6px;opacity:.4;"></i>
        No students match "<strong>${q}</strong>"
      </div>`;
    }

    target.innerHTML = html;
  }

  /* ── Counts ── */
  function updateCounts() {
    document.getElementById('countF1').textContent = dataF1.length;
    document.getElementById('countF5').textContent = dataF5.length;
    document.getElementById('hdrTotal').textContent =
      (dataF1.length + dataF5.length) + ' students';
  }

  /* ── Tab switch ── */
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(tab === 'f1' ? 'panelF1' : 'panelF5').classList.add('active');
    document.getElementById('tabF1').className = 'tab-btn' + (tab === 'f1' ? ' active-f1' : '');
    document.getElementById('tabF5').className = 'tab-btn' + (tab === 'f5' ? ' active-f5' : '');
  }

  /* ── Accordion ── */
  function toggleSection(id) {
    document.getElementById(id).classList.toggle('open');
  }

  /* ── Search ── */
  function applySearch() {
    searchQ = document.getElementById('searchInput').value;
    const q = searchQ.trim().toLowerCase();
    if (q) {
      const m1 = dataF1.filter(s => fullName(s).toLowerCase().includes(q)).length;
      const m5 = dataF5.filter(s => fullName(s).toLowerCase().includes(q)).length;
      const total = m1 + m5;
      document.getElementById('searchCount').textContent =
        total + ' result' + (total !== 1 ? 's' : '');
    } else {
      document.getElementById('searchCount').textContent = '';
    }
    renderTab('f1');
    renderTab('f5');
  }

  /* ── Start ── */
  loadAll();
</script>
</body>
</html>
