services:
  - type: web
    name: tbss-reg-system
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://mnxnhujvygzkjdihpcde.supabase.co
      - key: SUPABASE_PDF_BUCKET
        value: registrations
      - key: SUPABASE_PDF_PREFIX
        value: registrations
      - key: SUPABASE_SIGNED_URL_TTL
        value: "3600"
      # Add these in Render dashboard (keep secret):
      # SUPABASE_ANON_KEY, RESEND_API_KEY, SCHOOL_EMAIL
